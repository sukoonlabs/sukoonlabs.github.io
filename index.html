<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sukoon Labs</title>
<meta name="description" content="Sukoon Labs makes calm, thoughtful apps — few ads, no dark patterns.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --lagoon: #0F3D3E; --saffron: #F4B13E; --mist: #EEF4F1; --night: #0B1F21; --stone: #5B6B68; --ink: #24383A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--mist); color: var(--night); font: 17px/1.6 Sora, system-ui, sans-serif; }
  a { color: var(--lagoon); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 44px; height: 44px; }
  .brand b { font: 600 26px/1 Fraunces, serif; color: var(--lagoon); }
  .brand span { font-weight: 600; font-size: 12px; letter-spacing: 6px; color: var(--lagoon); }
  nav { display: flex; gap: 22px; font-size: 15px; }
  .hero { padding: 72px 0 64px; }
  h1 { font: 600 clamp(44px, 9vw, 76px)/1 Fraunces, serif; color: var(--lagoon); letter-spacing: -1px; margin: 0 0 18px; }
  .lead { font-size: 20px; color: var(--ink); max-width: 560px; margin: 0; }
  h2 { font: 600 30px/1.2 Fraunces, serif; color: var(--lagoon); margin: 0 0 18px; }
  section { padding: 40px 0; }
  .app { display: flex; gap: 20px; align-items: center; background: #fff; border-radius: 24px; padding: 20px; max-width: 560px; }
  .app img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid #D5E0DC; flex: none; }
  .app h3 { margin: 0; font-size: 19px; }
  .app p { margin: 4px 0 6px; color: var(--stone); font-size: 15px; }
  .app small { font-size: 14px; }
  footer { padding: 48px 0 64px; color: var(--stone); font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    body { background: var(--night); color: var(--mist); }
    a, .brand b, .brand span, h1, h2 { color: var(--mist); }
    .lead { color: #C9D6D3; }
    .app { background: #13302F; }
    .app p, footer { color: #9FB3AF; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./"><img src="mark.svg" alt=""><b>sukoon</b><span>LABS</span></a>
    <nav><a href="#apps">Apps</a><a href="#contact">Contact</a></nav>
  </header>

  <div class="hero">
    <h1>Calm by design.</h1>
    <p class="lead">Small, thoughtful apps that respect your time — few ads, no dark patterns.</p>
  </div>

  <section id="apps">
    <h2>Apps</h2>
    <div class="app">
      <img src="one-line-draw.png" alt="One Line Draw icon">
      <div>
        <h3>One Line Draw</h3>
        <p>Draw every line in one stroke. Calm, clever puzzles. Coming soon to Google Play.</p>
        <small><a href="privacy">Privacy policy</a></small>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p><a href="mailto:sukoonlabsdev@gmail.com">sukoonlabsdev@gmail.com</a></p>
  </section>

  <footer>© 2026 Sukoon Labs</footer>
</div>
</body>
</html>
